name: Build and Release Arnis

on:
  # A tag push builds and attaches. This is the trigger that matters, because a
  # release-triggered run checks out the workflow FROM THE TAG - so a fix on main is invisible
  # to a release cut from an older tag, which is exactly how 3.0.7 re-ran the same broken file
  # after the fix had already landed. Pushing the tag runs the tag's workflow deliberately, and
  # action-gh-release creates the release or updates the one that already exists.
  push:
    tags: ["v*"]
  # Kept so publishing a release by hand still builds.
  release:
    types: [created]

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other three. v3.0.7 shipped with ZERO assets
      # because the Linux AppImage step failed and fail-fast (the default) cancelled the
      # Windows and both macOS jobs mid-build - three healthy binaries thrown away over one
      # broken bundler.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: arnis.exe
            asset_name: arnis-windows.exe
          - os: ubuntu-22.04  # Oldest supported base for AppImage glibc/WebKitGTK compatibility
            target: x86_64-unknown-linux-gnu
            binary_name: arnis
            asset_name: arnis-linux
          - os: macos-15-intel  # Intel runner for x86_64 builds
            target: x86_64-apple-darwin
            binary_name: arnis
            asset_name: arnis-mac-intel
          - os: macos-latest  # ARM64 runner for ARM64 builds
            target: aarch64-apple-darwin
            binary_name: arnis
            asset_name: arnis-mac-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v6

    # A tag is a promise about what the binary will report. v3.0.8 was tagged without bumping
    # Cargo.toml, so the release advertised 3.0.8 and every binary in it printed 3.0.7 - which
    # means an updater comparing the release tag against `arnis --version` offers the same
    # upgrade forever: download, still 3.0.7, "3.0.8 available". Cheap to assert, invisible
    # otherwise, and it only runs for tag builds.
    - name: Tag must match the crate version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        tag="${GITHUB_REF_NAME#v}"
        crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
        if [ "$tag" != "$crate" ]; then
          echo "::error::tag $GITHUB_REF_NAME says $tag but Cargo.toml says $crate"
          exit 1
        fi
        echo "tag $GITHUB_REF_NAME matches Cargo.toml $crate"

    - uses: ./.github/actions/setup-arnis-linux
      with:
        rust-targets: ${{ matrix.target }}
        # Cold rebuild, which is what the comment always said - the value was flipped to "true"
        # in b0f1d66 and the comment left behind. That broke the Linux release outright:
        #
        #   build-script-build: /lib/x86_64-linux-gnu/libc.so.6:
        #       version `GLIBC_2.39' not found
        #
        # Build scripts are compiled for the HOST and then executed. ci-build.yml runs on
        # ubuntu-latest (24.04, glibc 2.39) and this job runs on ubuntu-22.04 (glibc 2.35), and
        # the cache key does not separate them - so the release job restored host binaries from
        # a newer glibc and could not run them. A release wants a cold build anyway.
        cache: "false"

    - name: Install dependencies
      run: cargo fetch

    - name: Install Tauri CLI
      if: runner.os == 'Linux'
      run: cargo install tauri-cli --version "^2.0" --locked

    # The plain binary is built on EVERY platform, including Linux. It used to come out of the
    # AppImage step as a side effect, so when the bundler broke there was no Linux binary at all
    # - and the AppImage is a convenience, while the binary is the thing Meld and the CLI run.
    #
    # Linux builds it HEADLESS. `default = ["gui"]` pulls in Tauri, and main() calls
    # gui::run_gui(), so the webkit2gtk/GTK DT_NEEDED entries survive --as-needed and the loader
    # resolves them before main() on every invocation - CLI arguments or not. On a machine
    # without the WebKitGTK runtime (headless render box, minimal desktop, Debian/Arch without
    # webkit2gtk-4.1) the binary dies with
    #
    #   ./arnis: error while loading shared libraries: libwebkit2gtk-4.1.so.0
    #
    # before it can print anything. Meld already knew this rule - meld_launch.py:220 and
    # server.py:1794 both pass --no-default-features when they build from source off Windows -
    # but the published asset was the GUI build. macOS is unaffected (Tauri links the
    # always-present system WebKit.framework) and Windows keeps its GUI.
    #
    # It is copied out immediately because the AppImage step below rebuilds WITH the GUI over
    # the same path; the generic rename step is skipped on Linux for the same reason.
    - name: Build
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Linux" ]; then
          cargo build --release --no-default-features --target ${{ matrix.target }}
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "target/release/${{ matrix.asset_name }}"
          ldd "target/release/${{ matrix.asset_name }}" | grep -q webkit \
            && { echo "::error::headless build still links webkit"; exit 1; } || true
        else
          cargo build --release --target ${{ matrix.target }}
        fi

    # Best-effort. AppImage tooling drags in FUSE, linuxdeploy and WebKitGTK, any of which can
    # break on a runner image update; when it does, the release should lose the AppImage and
    # keep everything else.
    - name: Build AppImage bundle (Linux, optional)
      id: appimage
      if: runner.os == 'Linux'
      continue-on-error: true
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1  # Avoids FUSE requirement on CI runners
      run: cargo tauri build --target ${{ matrix.target }} --bundles appimage

    # Skipped on Linux: the headless binary was already copied out above, and by now the AppImage
    # step has replaced target/<triple>/release/arnis with the GUI build.
    - name: Rename binary for release
      if: runner.os != 'Linux'
      run: mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} target/release/${{ matrix.asset_name }}

    - name: Set executable permission
      if: matrix.os != 'windows-latest'
      run: chmod +x target/release/${{ matrix.asset_name }}

    - name: Package binary as tar.gz (preserves executable permission)
      if: matrix.os != 'windows-latest'
      run: tar -czf target/release/${{ matrix.asset_name }}.tar.gz -C target/release ${{ matrix.asset_name }}

    - name: Package AppImage as tar.gz (Linux, preserves executable permission)
      if: runner.os == 'Linux' && steps.appimage.outcome == 'success'
      run: |
        mv target/${{ matrix.target }}/release/bundle/appimage/*.AppImage target/release/arnis-linux.AppImage
        chmod +x target/release/arnis-linux.AppImage
        tar -czf target/release/arnis-linux-appimage.tar.gz -C target/release arnis-linux.AppImage

    - name: Install Windows SDK
      if: matrix.os == 'windows-latest'
      run: |
        choco install windows-sdk-10.1 -y
        $env:Path += ";C:\Program Files (x86)\Windows Kits\10\bin\x64"
      shell: powershell

    - name: Locate signtool.exe
      if: matrix.os == 'windows-latest'
      id: locate_signtool
      run: |
        $env:ProgramFilesX86 = [System.Environment]::GetFolderPath('ProgramFilesX86')
        $signtoolPath = Get-ChildItem -Path "$env:ProgramFilesX86\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
        if (-not $signtoolPath) { throw "signtool.exe not found." }
        echo "signtool=$signtoolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell
    
    - name: Self-sign Windows executable
      if: matrix.os == 'windows-latest'
      run: |
        $password = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
        $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Arnis' -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
        Export-PfxCertificate -Cert $cert -FilePath arnis-cert.pfx -Password $password
        & $env:signtool sign /f arnis-cert.pfx /p $env:WINDOWS_CERT_PASSWORD /t http://timestamp.digicert.com target/release/${{ matrix.asset_name }}
      env:
        WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      shell: powershell

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-${{ matrix.target }}-build
        path: target/release/${{ matrix.asset_name }}${{ matrix.os != 'windows-latest' && '.tar.gz' || '' }}

    - name: Upload AppImage artifact
      if: runner.os == 'Linux' && steps.appimage.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: linux-appimage-build
        path: target/release/arnis-linux-appimage.tar.gz

  create-universal-macos:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    steps:
    - name: Download macOS Intel build
      uses: actions/download-artifact@v8
      with:
        name: macos-15-intel-x86_64-apple-darwin-build
        path: ./intel

    - name: Download macOS ARM64 build
      uses: actions/download-artifact@v8
      with:
        name: macos-latest-aarch64-apple-darwin-build
        path: ./arm64

    - name: Extract Intel and ARM64 binaries
      run: |
        tar -xzf ./intel/arnis-mac-intel.tar.gz -C ./intel
        tar -xzf ./arm64/arnis-mac-arm64.tar.gz -C ./arm64

    - name: Create universal binary
      run: |
        lipo -create -output arnis-mac-universal ./intel/arnis-mac-intel ./arm64/arnis-mac-arm64
        chmod +x arnis-mac-universal
        tar -czf arnis-mac-universal.tar.gz arnis-mac-universal

    - name: Upload universal binary
      uses: actions/upload-artifact@v7
      with:
        name: macos-universal-build
        path: arnis-mac-universal.tar.gz

  release:
    needs: [build, create-universal-macos]
    # Publish whatever built. A platform that fails should cost the release that one asset, not
    # every asset - `needs` alone would skip this job entirely and leave the release empty.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download Windows build artifact
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: windows-latest-x86_64-pc-windows-msvc-build
        path: ./builds/windows

    - name: Download Linux build artifact
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: ubuntu-22.04-x86_64-unknown-linux-gnu-build
        path: ./builds/linux

    # Optional, to match the build side: the AppImage is allowed to be absent, and the release
    # still goes out with the three real binaries.
    - name: Download Linux AppImage artifact
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: linux-appimage-build
        path: ./builds/linux

    - name: Download macOS universal build artifact
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: macos-universal-build
        path: ./builds/macos

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        # fail_on_unmatched_files stays off so a missing AppImage does not sink the release.
        # The three binaries below are the ones downstream depends on; Meld's launcher asks for
        # arnis-windows.exe, arnis-linux.tar.gz and arnis-mac-universal.tar.gz by name.
        fail_on_unmatched_files: false
        files: |
          builds/windows/arnis-windows.exe
          builds/linux/arnis-linux.tar.gz
          builds/linux/arnis-linux-appimage.tar.gz
          builds/macos/arnis-mac-universal.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
